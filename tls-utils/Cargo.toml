[package]
name = "solana-tls-utils"
description = "Solana TLS utilities"
documentation = "https://docs.rs/solana-tls-utils"
version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg=docsrs"]

[features]
agave-unstable-api = []

[dependencies]
agave-pq-crypto = { path = "../pq-crypto" }
crossbeam-channel = { workspace = true }
# ml-kem 0.2.1's prerelease constraint also resolves to incompatible kem 0.3.0.
kem = "=0.3.0-pre.0"
ml-kem = { version = "=0.2.1", features = ["zeroize"] }
quinn = { workspace = true }
rand08 = { package = "rand", version = "0.8.6" }
rustls = { workspace = true, features = ["ring"] }
rustls-webpki = { workspace = true }
solana-keypair = { workspace = true }
solana-pubkey = { workspace = true }
solana-signer = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "io-util"] }
zeroize = "1.8.2"

[lints]
workspace = true
